<!--base.html-->

{% load static %}
<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sky Send — сервис рассылок{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{% static 'favicon.ico' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">  <!-- Bootstrap CSS по CDN -->
    <link rel="stylesheet" href="{% static 'css/sky_send.css' %}">  <!-- Наши кастомные стили -->
</head>
<body>

    <!--Бар меню -->
    <header class="border-bottom">
        {% include "includes/up_bar_menu.html" %}
    </header>

    <!--Генезис сайта-->
    <main class="flex-grow-1">
        <!-- Инфоблок -->
        <section class="py-2 text-center container">
            {% include "includes/info_block.html" %}
        </section>

        <!-- Карточки статистики -->
        <div class="container my-4">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!--Подвал сайта-->
    <footer class="bd-footer py-3 bg-body-tertiary mt-5 border-top">
        {% include "includes/footer.html" %}
    </footer>

    {% include "includes/js/bootstrap_js.html" %}  <!-- Bootstrap JS по CDN -->

</body>
</html>
